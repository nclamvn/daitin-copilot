<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đại Tín | Đăng nhập Bàn hồ sơ</title>
<link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/copilot/m3/login.css">
<script src="/copilot/m3/login.js" defer></script>
<link rel="stylesheet" href="/brand.css">
<link rel="icon" href="/brand/daitin.png" type="image/png">
</head>
<body>
<main>
  <div class="identity"><img class="company-logo" src="/brand/daitin.png" alt="DAITIN Lawyers and Consultants"><span>Bàn hồ sơ sở hữu trí tuệ</span></div>
  <h1>Tiếp tục công việc</h1>
  <p>Đăng nhập để mở hồ sơ, đối chiếu căn cứ và tiếp tục từ bản đã lưu.</p>
  <form id="login" data-return-to="/copilot/m3/workspace/">
    <label for="username">Tài khoản<input id="username" name="username" autocomplete="username" required autofocus></label>
    <label for="key">Khóa truy cập pilot<input id="key" name="key" type="password" autocomplete="off" required maxlength="64"></label>
    <p id="error" role="alert" hidden></p>
    <button type="submit">Mở Bàn hồ sơ</button>
  </form>
  <p class="note">Dùng tài khoản đã được cấp cho nhóm. Hồ sơ và bản duyệt được lưu tại dịch vụ Đại Tín đang truy cập.</p>
</main>
</body></html>
